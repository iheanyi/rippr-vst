name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Test UI
        working-directory: ui
        run: npm test
      - name: Build embedded UI
        working-directory: ui
        run: npm run build
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace
      - name: Check real-time allocation discipline
        run: cargo test -p rippr-plugin --features rt-paranoid
      - name: Check standalone format
        run: cargo check -p rippr-plugin --no-default-features --features standalone
      - name: Check Audio Unit format
        if: runner.os == 'macOS'
        run: cargo check -p rippr-plugin --no-default-features --features au
