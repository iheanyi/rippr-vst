[package]
name = "rippr-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "rippr-vst-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["vst3"]
vst3 = ["dep:truce-vst3", "truce/vst3"]
au = ["dep:truce-au"]
standalone = ["dep:truce-standalone"]
rt-paranoid = ["truce/rt-paranoid"]

[dependencies]
directories.workspace = true
novonotes_run_loop = { git = "https://github.com/novonotes/wxp.git", rev = "db0db1c0ba795fd434a981c903dcd882b638e5ed", package = "novonotes_run_loop" }
parking_lot = "0.12"
process_path.workspace = true
raw-window-handle = "0.6"
rippr-core = { path = "../rippr-core" }
rtrb.workspace = true
send_wrapper = "0.6"
serde.workspace = true
serde_json.workspace = true
truce = { version = "=6.3.0", default-features = false }
truce-au = { version = "=6.3.0", optional = true }
truce-standalone = { version = "=6.3.0", features = ["gui"], optional = true }
truce-vst3 = { version = "=6.3.0", optional = true }
wxp = { git = "https://github.com/novonotes/wxp.git", rev = "db0db1c0ba795fd434a981c903dcd882b638e5ed", package = "wxp" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["block2", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSImage", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSResponder", "NSSavePanel", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSGeometry", "NSObject", "NSString", "NSURL"] }

[dev-dependencies]
tempfile.workspace = true
truce-test = "=6.3.0"
