[workspace]
resolver = "3"
members = [
  "crates/rippr-core",
  "crates/rippr-plugin",
  "crates/rippr-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Iheanyi Ekechukwu"]
repository = "https://github.com/iheanyi/rippr-vst"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
hex = "0.4"
hound = "3.5"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
process_path = "0.1.4"
rtrb = "0.3.4"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
